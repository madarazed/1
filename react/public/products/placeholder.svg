<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#0A2540"/>
    </linearGradient>
    <linearGradient id="canGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  
  <!-- Subtle circular halo -->
  <circle cx="200" cy="180" r="100" fill="#E2E8F0" opacity="0.6"/>

  <!-- Bottle Graphic -->
  <g transform="translate(145, 90)">
    <!-- Bottle neck and cap -->
    <rect x="22" y="10" width="16" height="18" rx="3" fill="#0A2540"/>
    <path d="M 22 28 Q 10 50 10 80 L 10 160 Q 10 170 20 170 L 40 170 Q 50 170 50 160 L 50 80 Q 50 50 38 28 Z" fill="url(#bottleGrad)"/>
    <!-- Bottle shine -->
    <path d="M 16 75 L 16 155 Q 16 162 20 162" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.3" fill="none"/>
  </g>

  <!-- Can Graphic -->
  <g transform="translate(195, 125)">
    <!-- Can Body -->
    <rect x="15" y="30" width="45" height="105" rx="10" fill="url(#canGrad)"/>
    <!-- Can Top -->
    <ellipse cx="37.5" cy="30" rx="20" ry="6" fill="#0284C7"/>
    <ellipse cx="37.5" cy="30" rx="14" ry="4" fill="#E2E8F0" opacity="0.8"/>
    <!-- Can shine -->
    <path d="M 23 45 L 23 125" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.35" fill="none"/>
  </g>

  <!-- Branding and Label -->
  <text x="200" y="315" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#003366" letter-spacing="3" text-anchor="middle">RAPIFRIOS</text>
  <text x="200" y="338" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1.5" text-anchor="middle">PRODUCTO EN CATÁLOGO</text>
</svg>
